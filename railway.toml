# Railway deployment configuration for Hermes Agent
# https://docs.railway.app/reference/config-as-code
#
# Required environment variables — set these in the Railway dashboard under
# the service's "Variables" tab.  Set them HERE, not via the in-app Hermes
# web dashboard: the in-app dashboard writes credentials to the persistent
# Volume (/opt/data/.env), and the Volume is region-locked — migrating the
# service to another region leaves it behind, so those credentials are lost.
# Railway Variables, by contrast, survive region migrations and redeploys.
#
#   DISCORD_BOT_TOKEN     — required for the Discord bot to come online
#   ANTHROPIC_API_KEY     — or OPENAI_API_KEY / other LLM provider key
#
# Persistent storage:
#   Attach a Railway Volume mounted at /opt/data (state.db, sessions, logs).
#   Volumes do NOT move across regions — when changing region, the data does
#   not follow.  Keep all credentials in Railway Variables (above) so a new
#   empty Volume in the new region does not take the bot offline.
#
# Optional — enable the web dashboard alongside the gateway:
#   HERMES_DASHBOARD=1              — start web UI in background
#   HERMES_DASHBOARD_HOST=0.0.0.0  — bind dashboard to all interfaces
#   PORT is injected automatically by Railway
#
# To deploy just the dashboard (no gateway):
#   Override startCommand to: dashboard --host 0.0.0.0 --no-open --insecure

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Run the gateway as the foreground process.
# Set HERMES_DASHBOARD=1 to also expose the web UI on Railway's PORT.
startCommand = "/usr/bin/tini -g -- /opt/hermes/docker/entrypoint.sh gateway run"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
